# Full stack: AWS RDS Postgres (via .env) + local Kafka + service-core + service-external
#
# 1) cp .env.example .env   # set POSTGRES_PASSWORD
# 2) docker compose -f docker-compose.full-stack.yml up -d --build
# 3) ./scripts/full-stack-seed-and-smoke.sh
#
# Kafka validate flow: core + external talk to kafka:29092 with PLAINTEXT when KAFKA_USERNAME
# and KAFKA_PASSWORD are empty (default). Set both + FULL_STACK_CORE_KAFKA=true + KAFKA_BOOTSTRAP_SERVERS for MSK.
#
# APIs: http://localhost:8000/docs  http://localhost:8002/docs

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  service-core:
    build:
      context: ./services/service-core
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      KAFKA_ENABLED: ${FULL_STACK_CORE_KAFKA:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}

  service-external:
    build:
      context: ./services/service-external
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      # reservation-validate: default pms mode calls PMS_ADAPTER_STRATEGY (query_availability).
      TH_RESERVATION_VALIDATE_MODE: ${TH_RESERVATION_VALIDATE_MODE:-pms}
      TH_MOCK_RESERVATION_EXISTS_RATE: ${TH_MOCK_RESERVATION_EXISTS_RATE:-0}
