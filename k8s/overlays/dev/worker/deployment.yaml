apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker-sa

      volumes:
        - name: kafka-ca
          emptyDir: {}

      containers:
        - name: worker
          image: 345340320521.dkr.ecr.us-east-2.amazonaws.com/service-core:e1f8d79c9e611712c38960444531e7c7e0b72df4
          imagePullPolicy: IfNotPresent

          command: [ "python" ]
          args:
            - "worker_reservation.py"

          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: KAFKA_LOCAL
              value: "false"
            - name: MAILER
              value: "http://service-soport:80/notification/send-email"

          envFrom:
            - secretRef:
                name: travelhub-postgres

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
