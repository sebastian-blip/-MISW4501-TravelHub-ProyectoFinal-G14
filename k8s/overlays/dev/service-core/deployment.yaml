apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-core
  labels:
    app.kubernetes.io/name: service-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-core
    spec:
      serviceAccountName: service-core-sa

      volumes:
        - name: kafka-ca
          emptyDir: {}

      containers:
        - name: service-core
          image: 345340320521.dkr.ecr.us-east-2.amazonaws.com/service-core:5484d8e553fe2276e4f82f1ac1f4a443d4d16fa7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000

          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: KAFKA_LOCAL
              value: "false"
            - mame: MAILER
              value: "https://k8s-travelhubdev-3d982ad1bb-1106876598.us-east-2.elb.amazonaws.com/service-soport/notification/send-email"

          envFrom:
            - secretRef:
                name: travelhub-postgres

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
