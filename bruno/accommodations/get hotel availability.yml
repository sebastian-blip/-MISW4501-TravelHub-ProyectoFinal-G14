info:
  name: get hotel availability
  type: http
  seq: 2

http:
  method: GET
  url: "{{core}}/accommodations/hotels/{{hotel_id}}/availability?check_in={{check_in}}&check_out={{check_out}}&guests={{guests}}"
  params:
    - name: check_in
      value: "{{check_in}}"
      type: query
    - name: check_out
      value: "{{check_out}}"
      type: query
    - name: guests
      value: "{{guests}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: hotel_id
      value: b1000000-0000-0000-0000-000000000001
    - name: check_in
      value: 2026-05-01
    - name: check_out
      value: 2026-05-05
    - name: guests
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
