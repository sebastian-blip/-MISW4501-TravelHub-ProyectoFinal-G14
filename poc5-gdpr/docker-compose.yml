# PoC-5 GDPR - Derecho al olvido (experiment)
# DB: DuckDB (db_service HTTP API) | Broker: Redis (Redis Streams)

services:
  db:
    build:
      context: .
      dockerfile: db_service/Dockerfile
    container_name: poc5_gdpr_db
    environment:
      DATABASE_PATH: /data/poc5_gdpr.duckdb
    ports:
      - "8080:8080"
    volumes:
      - poc5_duckdb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: poc5_gdpr_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-user-service:
    build:
      context: .
      dockerfile: core_user_service/Dockerfile
    container_name: poc5_gdpr_core_user_service
    restart: on-failure
    environment:
      DB_API_URL: http://db:8080
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"

  core-reader-service:
    build:
      context: .
      dockerfile: core_reader_service/Dockerfile
    container_name: poc5_gdpr_core_reader
    restart: on-failure
    environment:
      DB_API_URL: http://db:8080
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  core-reservations-consumer:
    build:
      context: .
      dockerfile: core_reservations_consumer/Dockerfile
    container_name: poc5_gdpr_core_reservations
    restart: on-failure
    environment:
      DB_API_URL: http://db:8080
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  apoyo-analytics-consumer:
    build:
      context: .
      dockerfile: apoyo_analytics_consumer/Dockerfile
    container_name: poc5_gdpr_apoyo_analytics
    restart: on-failure
    environment:
      DB_API_URL: http://db:8080
      REDIS_URL: redis://redis:6379/0
      DELAY_ANALYTICS_SEC: "0"
      ANONYMOUS_USER_ID: "00000000-0000-0000-0000-000000000001"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  poc5_duckdb_data:
