apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-rollouts-leader-election
  namespace: default
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-rollouts-leader-election-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: argo-rollouts
  namespace: default
roleRef:
  kind: Role
  name: argo-rollouts-leader-election
  apiGroup: rbac.authorization.k8s.io