name: Commit validate

on:
  push:
  pull_request:

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Validando commits en PR (${BASE_SHA}..${HEAD_SHA})"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
            echo "Validando commits en push (${BASE_SHA}..${HEAD_SHA})"
          fi

          # Solo intentar unshallow si el clone es shallow (con fetch-depth: 0 no lo es → evita fatal).
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --unshallow || true
          elif [ -f .git/shallow ]; then
            git fetch --unshallow || true
          fi
          git fetch --all --tags

          ALLOWED_REGEX="^(feat|fix|hotfix|bugfix|breakingchange)(\(|!|\:)"
          INVALID_COMMIT_MSGS=""

          # Handle cases where BASE_SHA is not present (new branch, force-push, shallow history).
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "HEAD_SHA no disponible en el checkout; usando HEAD"
            HEAD_SHA="HEAD"
          fi

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "BASE_SHA vacío/zero; validando solo HEAD_SHA (${HEAD_SHA})"
            RANGE="${HEAD_SHA}"
          elif git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            echo "BASE_SHA no disponible (${BASE_SHA}); intentando traerlo del remoto"
            git fetch origin "${BASE_SHA}" || true
            if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              RANGE="${BASE_SHA}..${HEAD_SHA}"
            else
              echo "No se pudo resolver BASE_SHA; validando solo HEAD_SHA (${HEAD_SHA})"
              RANGE="${HEAD_SHA}"
            fi
          fi

          echo "Rango efectivo: ${RANGE}"
          # --first-parent: no validar todo el historial traído por merges desde main u otras ramas.
          COMMITS=$(git log $RANGE --first-parent --pretty=format:"%H")

          for sha in $COMMITS; do
            MSG=$(git log -1 --pretty=format:"%s" $sha)
            # Commits de merge estándar de Git (Merge branch '…') no siguen el prefijo feat|fix|…
            if [[ "$MSG" =~ ^Merge[[:space:]] ]]; then
              echo "Omitiendo merge: $sha $MSG"
              continue
            fi
            if [[ ! $MSG =~ $ALLOWED_REGEX ]]; then
              INVALID_COMMIT_MSGS="$INVALID_COMMIT_MSGS\n - $sha: $MSG"
            fi
          done

          if [ -n "$INVALID_COMMIT_MSGS" ]; then
            echo "❌ Los siguientes commits tienen mensajes inválidos y deben empezar con uno de feat, fix, hotfix, bugfix, breakingchange:"
            echo -e "$INVALID_COMMIT_MSGS"
            exit 1
          else
            echo "✅ Todos los commits tienen prefijo válido."
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}