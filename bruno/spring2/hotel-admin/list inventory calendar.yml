info:
  name: list inventory calendar
  type: http
  seq: 2

http:
  method: GET
  url: "{{local_core}}/hotel-admin/inventory-calendar?start_date={{start_date}}&end_date={{end_date}}&room_type_id={{room_type_id}}"
  params:
    - name: start_date
      value: "{{start_date}}"
      type: query
    - name: end_date
      value: "{{end_date}}"
      type: query
    - name: room_type_id
      value: "{{room_type_id}}"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: start_date
      value: "2026-05-01"
    - name: end_date
      value: "2026-05-07"
    - name: room_type_id
      value: "c1000000-0000-0000-0000-000000000101"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
