apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-core-hpa
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: service-core
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70