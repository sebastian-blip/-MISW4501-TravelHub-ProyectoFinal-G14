apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: travelhub-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: travelhub-postgres
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: bd_travelhub
        property: host
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: bd_travelhub
        property: port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: bd_travelhub
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: bd_travelhub
        property: password
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: kafka_boos
        property: kafka_boos
    - secretKey: KAFKA_USERNAME
      remoteRef:
        key: kafka-user
        property: kafka-user
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: kafka-pass
        property: kafka-pass
    - secretKey: TOKEN_SOPORT_SERVICES
      remoteRef:
        key: soport_token
        property: soport_token