info:
  name: get room calendar
  type: http
  seq: 3

http:
  method: GET
  url: "{{local_core}}/service-core/hotel-admin/rooms/{{room_type_id}}/calendar?start_date={{start_date}}&end_date={{end_date}}"
  params:
    - name: start_date
      value: "{{start_date}}"
      type: query
    - name: end_date
      value: "{{end_date}}"
      type: query
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  variables:
    - name: start_date
      value: 2026-05-01
    - name: end_date
      value: 2026-05-30

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
