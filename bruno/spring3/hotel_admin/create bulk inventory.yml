info:
  name: create bulk inventory
  type: http
  seq: 5

http:
  method: POST
  url: "{{local_core}}/service-core/hotel-admin/inventory/bulk"
  body:
    type: json
    data: |2-
        {
          "room_type_id": "{{room_type_id}}",
          "start_date": "{{start_date}}",
          "end_date": "{{end_date}}",
          "available_units": 8,
          "price_per_night": "180.00",
          "currency_code": "USD",
          "minimum_stay": 1
        }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  variables:
    - name: start_date
      value: 2026-11-01
    - name: end_date
      value: 2026-11-30

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
