info:
  name: search accommodations
  type: http
  seq: 1

http:
  method: GET
  url: "{{local_core}}/accommodations/search?city={{city}}&check_in={{check_in}}&check_out={{check_out}}&guests={{guests}}"
  params:
    - name: city
      value: "{{city}}"
      type: query
    - name: check_in
      value: "{{check_in}}"
      type: query
    - name: check_out
      value: "{{check_out}}"
      type: query
    - name: guests
      value: "{{guests}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: city
      value: Bogotá
    - name: check_in
      value: 2026-05-01
    - name: check_out
      value: 2026-05-05
    - name: guests
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
