info:
  name: list room types
  type: http
  seq: 3

http:
  method: GET
  url: "{{local_core}}/hotel-admin/room-types?include_inactive={{include_inactive}}"
  params:
    - name: include_inactive
      value: "{{include_inactive}}"
      type: query
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  variables:
    - name: include_inactive
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
