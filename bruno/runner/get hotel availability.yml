info:
  name: get hotel availability
  type: http
  seq: 3

http:
  method: GET
  url: "{{core}}/accommodations/hotels/{{hotel_id}}/availability?check_in={{check_in}}&check_out={{check_out}}&guests={{guests}}"
  params:
    - name: check_in
      value: "{{check_in}}"
      type: query
    - name: check_out
      value: "{{check_out}}"
      type: query
    - name: guests
      value: "{{guests}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: hotel_id
      value: b1000000-0000-0000-0000-000000000001
    - name: check_in
      value: 2026-05-01
    - name: check_out
      value: 2026-05-05
    - name: guests
      value: "2"
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        // Tests - respuesta general
        test("Status 200", function() {
            expect(res.getStatus()).to.equal(200);
        });

        test("hotel_id existe", function() {
            expect(data.hotel_id).to.be.a("string").and.not.empty;
        });

        test("hotel_name existe", function() {
            expect(data.hotel_name).to.be.a("string").and.not.empty;
        });

        test("city es Bogotá", function() {
            expect(data.city).to.equal("Bogotá");
        });

        test("stars es número", function() {
            expect(data.stars).to.be.a("number");
        });

        test("rating existe", function() {
            expect(data.rating).to.be.a("string").and.not.empty;
        });

        test("nights existe", function() {
            expect(data.nights).to.be.a("number");
        });

        test("check_in_time existe", function() {
            expect(data.check_in_time).to.be.a("string").and.not.empty;
        });

        test("check_out_time existe", function() {
            expect(data.check_out_time).to.be.a("string").and.not.empty;
        });

        // Tests - available_room_types
        test("available_room_types es array no vacío", function() {
            expect(data.available_room_types).to.be.an("array").and.not.empty;
        });

        test("cada room_type tiene id", function() {
            data.available_room_types.forEach(room => {
                expect(room.id).to.be.a("string").and.not.empty;
            });
        });

        test("cada room_type tiene price_per_night y total_price", function() {
            data.available_room_types.forEach(room => {
                expect(room.price_per_night).to.be.a("string").and.not.empty;
                expect(room.total_price).to.be.a("string").and.not.empty;
            });
        });

        test("cada room_type tiene currency_code USD", function() {
            data.available_room_types.forEach(room => {
                expect(room.currency_code).to.equal("USD");
            });
        });

        test("cada room_type tiene amenities no vacío", function() {
            data.available_room_types.forEach(room => {
                expect(room.amenities).to.be.an("array").and.not.empty;
            });
        });

        test("cada amenity tiene name e icon", function() {
            data.available_room_types.forEach(room => {
                room.amenities.forEach(amenity => {
                    expect(amenity.name).to.be.a("string").and.not.empty;
                    expect(amenity.icon).to.be.a("string").and.not.empty;
                });
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
