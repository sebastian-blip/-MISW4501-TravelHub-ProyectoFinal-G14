apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker-sa

      volumes:
        - name: kafka-ca
          emptyDir: {}

      containers:
        - name: worker
          image: 345340320521.dkr.ecr.us-east-2.amazonaws.com/service-core:155c0065a616ecd5fa701f0d404dab1ed34162b8
          imagePullPolicy: IfNotPresent

          command: [ "python" ]
          args:
            - "worker_reservation.py"

          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: KAFKA_LOCAL
              value: "false"
            - name: MAILER
              value: "http://service-soport:80/notification/send-email"

          envFrom:
            - secretRef:
                name: travelhub-postgres

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
