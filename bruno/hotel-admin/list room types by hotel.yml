info:
  name: list room types by hotel
  type: http
  seq: 3

http:
  method: GET
  url: "{{local_core}}/hotel-admin/hotels/{{hotel_id}}/room-types?include_inactive={{include_inactive}}"
  params:
    - name: hotel_id
      value: "{{hotel_id}}"
      type: path
    - name: include_inactive
      value: "{{include_inactive}}"
      type: query
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  variables:
    - name: hotel_id
      value: b1000000-0000-0000-0000-000000000001
    - name: include_inactive
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
