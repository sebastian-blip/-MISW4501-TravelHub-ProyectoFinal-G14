# Local Postgres + PLAINTEXT Kafka (optional; service-core expects SASL for real Kafka).
#
# Initial DB data: pipe repo SQL into Postgres (from repo root):
#   docker compose -f docker-compose.local-dev.yml up -d postgres
#   cat schemas/db.sql | docker compose -f docker-compose.local-dev.yml exec -T postgres \
#     psql -U postgres -d travelhub -v ON_ERROR_STOP=1
#   cat schemas/seed_hotels.sql | docker compose -f docker-compose.local-dev.yml exec -T postgres \
#     psql -U postgres -d travelhub -v ON_ERROR_STOP=1
#   cat schemas/seed_reservations.sql | docker compose -f docker-compose.local-dev.yml exec -T postgres \
#     psql -U postgres -d travelhub -v ON_ERROR_STOP=1
# Order matters. seed_reservations.sql adds payment_providers, sample reservations, etc.
#
# service-external + this broker: KAFKA_BOOTSTRAP_SERVERS=localhost:9092, omit USER/PASS (PLAINTEXT).
# If your shell exports MSK creds, unset them for this broker or use kafka_config_testing in tests only.
#
# Usage: docker compose -f docker-compose.local-dev.yml up -d

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelhub
