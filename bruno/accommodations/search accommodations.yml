info:
  name: search accommodations
  type: http
  seq: 1

http:
  method: GET
  url: http://0.0.0.0:8000/accommodations/search?city={{city}}&check_in={{check_in}}&check_out={{check_out}}&guests={{guests}}
  auth: inherit

runtime:
  variables:
    - name: city
      value: Bogotá
    - name: check_in
      value: 2026-05-01
    - name: check_out
      value: 2026-05-05
    - name: guests
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
